<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dragon Hunter Field</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-app" aria-label="Dragon Hunter Field">
      <section class="start-screen" id="startScreen" aria-label="Start menu">
        <div class="start-card">
          <div class="start-logo">
            <span>Dragon</span>
            <strong>Hunter</strong>
          </div>
          <p class="start-copy">村から出て、倒して稼ぎ、装備を整え、より遠くへ。</p>
          <div class="start-actions">
            <button type="button" id="newGameButton">はじめから</button>
            <button type="button" id="continueButton">つづきから</button>
          </div>
          <div class="start-help" id="continueInfo">Enter: つづき / N: はじめから</div>
        </div>
      </section>

      <section class="playdeck">
        <aside class="command-panel" aria-label="Commands">
          <div class="panel-title"><span>Dragon</span><span>Hunter</span></div>
          <button type="button" data-command="talk">話す/調べる</button>
          <button type="button" data-command="search">採取</button>
          <button type="button" data-command="items">道具</button>
          <button type="button" data-command="stats">もちもの</button>
          <button type="button" data-command="save">保存</button>
          <div class="gold-box" id="goldBox">0G</div>
        </aside>

        <div class="screen-wrap">
          <canvas id="game" width="240" height="176" tabindex="0"></canvas>
          <div class="toast" id="toast" aria-live="polite"></div>
        </div>

        <aside class="status-panel" aria-label="Status">
          <div class="status-row"><span>LV</span><strong id="levelText">1</strong></div>
          <div class="status-row"><span>HP</span><strong id="hpText">--</strong></div>
          <div class="status-row"><span>EXP</span><strong id="expText">0</strong></div>
          <div class="status-row"><span>剣</span><strong id="weaponText">木</strong></div>
          <div class="status-row"><span>鎧</span><strong id="armorText">布</strong></div>
          <div class="status-row"><span>連</span><strong id="comboText">0</strong></div>
          <div class="status-row"><span>鱗</span><strong id="scaleText">0/3</strong></div>
          <div class="zone" id="zoneText">草原</div>
          <div class="item-dock" aria-label="Items">
            <button type="button" data-quick-slot="0" aria-label="Quick item 1"><small>1</small><span class="quick-name">薬</span><strong class="quick-count">2</strong></button>
            <button type="button" data-quick-slot="1" aria-label="Quick item 2"><small>2</small><span class="quick-name">爆</span><strong class="quick-count">1</strong></button>
            <button type="button" data-quick-slot="2" aria-label="Quick item 3"><small>3</small><span class="quick-name">護</span><strong class="quick-count">0</strong></button>
          </div>
        </aside>
      </section>

      <nav class="touch-controls" aria-label="Touch controls">
        <div class="dpad">
          <button type="button" data-keys="ArrowUp ArrowLeft" aria-label="Up left">↖</button>
          <button type="button" data-key="ArrowUp" aria-label="Up">▲</button>
          <button type="button" data-keys="ArrowUp ArrowRight" aria-label="Up right">↗</button>
          <button type="button" data-key="ArrowLeft" aria-label="Left">◀</button>
          <button type="button" data-key="ArrowRight" aria-label="Right">▶</button>
          <button type="button" data-keys="ArrowDown ArrowLeft" aria-label="Down left">↙</button>
          <button type="button" data-key="ArrowDown" aria-label="Down">▼</button>
          <button type="button" data-keys="ArrowDown ArrowRight" aria-label="Down right">↘</button>
        </div>
        <div class="action-pad">
          <button type="button" data-key="Enter" aria-label="Action">攻撃</button>
          <button type="button" data-key="ShiftLeft" aria-label="Dash">回避</button>
          <button type="button" data-key="KeyH" aria-label="Item">道具</button>
        </div>
      </nav>
    </main>

    <script src="src/data/definitions.js"></script>
    <script src="src/data/maps/world.js"></script>
    <script src="src/core/math.js"></script>
    <script src="src/core/state.js"></script>
    <script src="src/core/context.js"></script>
    <script src="src/systems/combat.js"></script>
    <script src="src/systems/player.js"></script>
    <script src="src/systems/map.js"></script>
    <script src="src/systems/rewards.js"></script>
    <script src="src/systems/save.js"></script>
    <script src="src/systems/effects.js"></script>
    <script src="src/systems/text.js"></script>
    <script src="src/systems/spawn.js"></script>
    <script src="src/systems/npc.js"></script>
    <script src="src/systems/actions.js"></script>
    <script src="src/systems/projectiles.js"></script>
    <script src="src/systems/monsters.js"></script>
    <script src="src/systems/render.js"></script>
    <script src="src/systems/ui.js"></script>
    <script src="src/systems/controls.js"></script>
    <script src="src/data/audio.js"></script>
    <script src="src/game.js"></script>
  </body>
</html>
